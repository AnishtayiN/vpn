name: Release APK and EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version to build and publish (example: 1.0.0). Required before the workflow starts."
        required: true
        type: string
        default: "1.0.0"
      notes:
        description: "Release notes shown on GitHub Releases and in the in-app updater"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark this GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LICAPI: https://voidrau.massagetoanishtayin.workers.dev
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FLUTTER_VERSION: "3.27.4"
  JAVA_VERSION: "17"
  AETHER_TAG: "v2.4.0"
  AETHER_LEGACY_TAG: "v2.3.0"
  HEV_TAG: "2.17.1"
  CHANNEL_URL: "https://t.me/Voidrau"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      notes: ${{ steps.v.outputs.notes }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          INPUT_PRE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION:-}"
            NOTES="${INPUT_NOTES:-}"
            PRE="${INPUT_PRE:-false}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            NOTES=""
            PRE="false"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.0.0 (got '$VERSION')"
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRE}"
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building VoidrauVPN v${VERSION}"

  android:
    needs: version
    runs-on: ubuntu-latest
    # Dual-core Android build (VoidrauVPN v1.4.0+):
    #  - legacy: Aether 2.3.0, minSdk 24, for Android 7-9. Its files carry a
    #    -Legacy suffix so a user on an old phone never picks the modern
    #    APK by mistake. It does NOT build an .aab.
    #  - modern: Aether 2.4.0, minSdk 29, for Android 10+. Its files keep
    #    the historic names, and it builds the .aab — Play filters an .aab
    #    by minSdk, so old devices are simply not offered it.
    strategy:
      matrix:
        include:
          - variant: legacy
            aether_tag: v2.3.0
            min_sdk: 24
            suffix: -Legacy
            build_aab: false
          - variant: modern
            aether_tag: v2.4.0
            min_sdk: 29
