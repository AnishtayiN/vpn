name: voidrauvpn
description: VoidrauVPN — a fast, free Flutter VPN client for Android, Windows and iOS.
publish_to: "none"
version: 1.3.1+10301

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pure-Dart zip reading for the Windows core-only update (the portable
  # release zip is unpacked in-process; Windows 8.1 has no Expand-Archive).
  archive: ^4.0.0
  crypto: ^3.0.6
  # 10.3.4, not 11.2.0, on purpose (finding 12): the v11 changelog says a
  # direct jump from pre-v10 loses data saved with the deprecated ciphers
  # ("upgrade to v10 first so existing data is migrated"), and v11 removes
  # AndroidOptions.encryptedSharedPreferences, which lib/services/
  # secure_store.dart still uses. v10 auto-migrates the stored data to the
  # new ciphers, so the 11.x jump becomes safe in a later release.
  flutter_secure_storage: ^10.3.4
  http: ^1.2.2
  http_parser: ^4.1.2
  package_info_plus: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
  assets:
    - assets/branding/icon.png
    - assets/legal/Aether-AGPL-3.0.txt
    - assets/legal/Hev-MIT.txt
    # Xray Worker script, deployed by the setup wizard to the user's own
    # Cloudflare account (see lib/services/cloudflare_api.dart).
    - worker/worker.js
