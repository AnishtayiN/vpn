name: voidrauvpn
description: VoidrauVPN — a fast, free Flutter VPN client for Android, Windows and iOS.
publish_to: "none"
version: 1.1.0+10100

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.2.2
  package_info_plus: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icon.png
    - assets/legal/Aether-AGPL-3.0.txt
    - assets/legal/Hev-MIT.txt
