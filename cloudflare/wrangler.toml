name = "voidrau-license"
main = "license-worker.js"
compatibility_date = "2024-09-01"

# Create with: wrangler kv namespace create LICENSES  → paste the id below
[[kv_namespaces]]
binding = "LICENSES"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Secrets (set with `wrangler secret put`): BOT_TOKEN, ADMIN_ID, BOT_USERNAME is optional var:
[vars]
# BOT_USERNAME = "VoidrauLicenseBot"
